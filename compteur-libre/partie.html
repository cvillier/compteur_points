<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<title>Compteur libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>Compteur libre 🔢</h1>

  <div class="stack">

    <div class="table-wrap">
      <table class="scoreboard">
        <thead>
          <tr id="header-row">
            <th>Tour</th>
          </tr>
        </thead>
        <tbody id="score-body"></tbody>
        <tfoot>
          <tr id="total-row">
            <td>Total</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <button id="start-turn-btn" class="btn" type="button"><span>C'est au tour de <strong id="start-turn-name"></strong></span></button>
    <button id="end-game-btn" class="btn-outline" type="button">Terminer la partie et voir les résultats 🏁</button>

  </div>

  <button id="menu-btn" class="btn-outline btn-block btn-pinned-bottom" type="button">Menu principal</button>

  <div id="quit-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <p class="modal-question">Êtes-vous sûr de vouloir quitter la partie en cours ?</p>
      <div class="modal-actions">
        <button id="quit-no" class="btn-outline btn-outline-success">NON 😊</button>
        <button id="quit-yes" class="btn btn-danger">OUI 😣</button>
      </div>
    </div>
  </div>

  <div id="end-game-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <p class="modal-question">Terminer la partie et voir les résultats ?</p>
      <div class="modal-actions">
        <button id="end-game-no" class="btn-outline btn-outline-success">NON 😊</button>
        <button id="end-game-yes" class="btn btn-success">OUI 🏁</button>
      </div>
    </div>
  </div>

  <div id="score-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button id="score-modal-close" class="modal-close" type="button" aria-label="Fermer">❌</button>
      <p class="turn-indicator">Score de ce tour pour <strong id="score-modal-name"></strong></p>

      <input type="number" id="score-input" class="score-input score-input-big" step="1" value="0">

      <button id="score-validate-btn" class="btn" type="button">Valider ✅</button>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    const players = JSON.parse(sessionStorage.getItem("libre_players") || "[]");

    if (players.length === 0) {
      window.location.href = "selection-des-joueurs.html";
    } else {
      function newRound() {
        return players.map(() => null);
      }

      const rounds = [newRound()];
      let currentRound = 0;
      let currentPlayer = 0;

      const headerRow = document.getElementById("header-row");
      const scoreBody = document.getElementById("score-body");
      const totalRow = document.getElementById("total-row");
      const tableWrap = document.querySelector(".table-wrap");
      const startTurnBtn = document.getElementById("start-turn-btn");
      const startTurnName = document.getElementById("start-turn-name");
      const scoreModal = document.getElementById("score-modal");
      const scoreModalName = document.getElementById("score-modal-name");
      const scoreInput = document.getElementById("score-input");

      function totalFor(p) {
        let total = 0;
        rounds.forEach(round => {
          if (typeof round[p] === "number") total += round[p];
        });
        return total;
      }

      function roundsPlayedFor(p) {
        let count = 0;
        rounds.forEach(round => {
          if (typeof round[p] === "number") count++;
        });
        return count;
      }

      function renderHeader() {
        headerRow.querySelectorAll("th:not(:first-child)").forEach(th => th.remove());
        players.forEach((name, p) => {
          const th = document.createElement("th");
          th.textContent = name;
          if (p === currentPlayer) th.classList.add("current-player");
          headerRow.appendChild(th);
        });
      }

      function renderBody() {
        scoreBody.innerHTML = "";
        rounds.forEach((round, r) => {
          const tr = document.createElement("tr");

          const roundLabel = document.createElement("td");
          roundLabel.textContent = "Tour " + (r + 1);
          tr.appendChild(roundLabel);

          round.forEach((score, p) => {
            const td = document.createElement("td");
            td.textContent = typeof score === "number" ? score : "–";
            if (r === currentRound && p === currentPlayer) {
              td.classList.add("current-cell");
            }
            tr.appendChild(td);
          });

          scoreBody.appendChild(tr);
        });
      }

      function renderTotals() {
        totalRow.querySelectorAll("td:not(:first-child)").forEach(td => td.remove());
        players.forEach((name, p) => {
          const td = document.createElement("td");
          td.textContent = totalFor(p);
          totalRow.appendChild(td);
        });
      }

      function renderAll() {
        startTurnName.textContent = players[currentPlayer];
        renderHeader();
        renderBody();
        renderTotals();

        // Keep the current round in view: pin the scroll to the bottom so
        // only older rounds require scrolling up to be seen.
        requestAnimationFrame(() => {
          tableWrap.scrollTop = tableWrap.scrollHeight;
        });
      }

      function recordTurn(score) {
        rounds[currentRound][currentPlayer] = score;

        currentPlayer++;
        if (currentPlayer >= players.length) {
          currentPlayer = 0;
          currentRound++;
          rounds.push(newRound());
        }

        renderAll();
      }

      function endGame() {
        const totals = players.map((name, p) => totalFor(p));
        const roundsPlayed = players.map((name, p) => roundsPlayedFor(p));
        sessionStorage.setItem("libre_results", JSON.stringify({
          players,
          totals,
          roundsPlayed,
        }));
        window.location.href = "resultats.html";
      }

      startTurnBtn.addEventListener("click", () => {
        scoreModalName.textContent = players[currentPlayer];
        scoreInput.value = 0;
        scoreModal.hidden = false;
      });

      document.getElementById("score-modal-close").addEventListener("click", () => {
        scoreModal.hidden = true;
      });

      document.getElementById("score-validate-btn").addEventListener("click", () => {
        const score = Math.trunc(Number(scoreInput.value)) || 0;
        scoreModal.hidden = true;
        recordTurn(score);
      });

      const endGameModal = document.getElementById("end-game-modal");
      document.getElementById("end-game-btn").addEventListener("click", () => {
        endGameModal.hidden = false;
      });
      document.getElementById("end-game-no").addEventListener("click", () => {
        endGameModal.hidden = true;
      });
      document.getElementById("end-game-yes").addEventListener("click", () => {
        endGameModal.hidden = true;
        endGame();
      });

      const quitModal = document.getElementById("quit-modal");
      document.getElementById("menu-btn").addEventListener("click", () => {
        quitModal.hidden = false;
      });
      document.getElementById("quit-no").addEventListener("click", () => {
        quitModal.hidden = true;
      });
      document.getElementById("quit-yes").addEventListener("click", () => {
        window.location.href = "../index.html";
      });

      renderAll();
    }
  </script>

</body>
</html>
