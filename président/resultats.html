<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Résultats — Compte-Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>Partie terminée ! 👑💩</h1>

  <div class="stack stack-wide">

    <div class="tabs">
      <button class="tab-btn active" data-tab="score" type="button">Score</button>
      <button class="tab-btn" data-tab="stats" type="button">Statistiques</button>
    </div>

    <ol id="score-tab" class="list"></ol>

    <div id="stats-tab" class="table-wrap" hidden>
      <table class="scoreboard">
        <thead>
          <tr id="stats-header-row">
            <th>Joueur</th>
          </tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </div>

    <a href="selection-des-joueurs.html" class="btn-outline">Nouvelle partie 🔁</a>
    <a href="../index.html" class="btn-outline">Retour au menu principal</a>

  </div>

  <script src="../common.js"></script>
  <script>
    const results = JSON.parse(sessionStorage.getItem("president_results") || "null");

    if (!results) {
      window.location.href = "selection-des-joueurs.html";
    } else {
      const { players, totals, roleCounts, roundsPlayed } = results;
      const total = players.length;

      function getRoles() {
        if (total === 3) {
          return ["Président 👑", "Neutre", "Trou du cul 💩"];
        }
        if (total === 4) {
          return ["Président 👑", "Vice-Président", "Vice-trou du cul", "Trou du cul 💩"];
        }
        return ["Président 👑", "Vice-Président", "Neutre", "Vice-trou du cul", "Trou du cul 💩"];
      }

      const roles = getRoles();

      const scoreTab = document.getElementById("score-tab");
      const statsHeaderRow = document.getElementById("stats-header-row");
      const statsBody = document.getElementById("stats-body");

      const order = players.map((name, i) => i).sort((a, b) => totals[b] - totals[a]);
      const medals = ["🏆 ", "🥈 ", "🥉 "];

      order.forEach((p, rank) => {
        const li = document.createElement("li");
        li.className = "list-item";

        const name = document.createElement("span");
        name.className = "list-item-name";
        name.textContent = (medals[rank] || "💩 ") + players[p];

        const score = document.createElement("span");
        score.className = "list-item-score";
        score.textContent = totals[p];

        li.append(name, score);
        scoreTab.appendChild(li);
      });

      roles.forEach(role => {
        const th = document.createElement("th");
        th.textContent = role;
        statsHeaderRow.appendChild(th);
      });
      const roundsTh = document.createElement("th");
      roundsTh.textContent = "Manches";
      statsHeaderRow.appendChild(roundsTh);
      const avgTh = document.createElement("th");
      avgTh.textContent = "Pts/manche";
      statsHeaderRow.appendChild(avgTh);

      // Listed in player order here (not ranked) since the ranking
      // is already shown in the "Score" tab.
      players.forEach((name, p) => {
        const tr = document.createElement("tr");
        const avg = roundsPlayed > 0 ? (totals[p] / roundsPlayed).toFixed(2) : "–";
        const counts = roles.map(role => roleCounts[p][role] || 0);
        [name, ...counts, roundsPlayed, avg].forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });
        statsBody.appendChild(tr);
      });

      document.querySelectorAll(".tab-btn").forEach(tabBtn => {
        tabBtn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          tabBtn.classList.add("active");
          scoreTab.hidden = tabBtn.dataset.tab !== "score";
          document.getElementById("stats-tab").hidden = tabBtn.dataset.tab !== "stats";
        });
      });
    }
  </script>

</body>
</html>
