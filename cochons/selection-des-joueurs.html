<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐖</text></svg>">
<title>Sélection des joueurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>Jeu des cochons 🐖🐖</h1>

  <div class="stack">

    <form id="player-form" class="field-row">
      <input
        type="text"
        id="player-name"
        class="text-field"
        placeholder="Nom du joueur"
        autocomplete="off"
        maxlength="30"
      >
      <button type="submit" class="btn-outline">Ajouter</button>
    </form>

    <p id="empty-message" class="helper-text">Ajoutez le premier joueur ci-dessus 👆</p>

    <ol id="player-list" class="list"></ol>

    <button id="start-btn" class="btn" disabled>Lancer la partie 🥳</button>
    <p id="start-helper" class="helper-text">Ajoutez au moins 2 joueurs pour commencer</p>

  </div>

  <button id="menu-btn" class="btn-outline btn-block btn-pinned-bottom" type="button">Menu principal</button>

  <div id="quit-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <p class="modal-question">Êtes-vous sûr de vouloir quitter la partie en cours ?</p>
      <div class="modal-actions">
        <button id="quit-no" class="btn-outline btn-outline-success">NON 😊</button>
        <button id="quit-yes" class="btn btn-danger">OUI 😣</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    const players = JSON.parse(sessionStorage.getItem("cochons_players") || "[]");

    const form = document.getElementById("player-form");
    const nameInput = document.getElementById("player-name");
    const list = document.getElementById("player-list");
    const emptyMessage = document.getElementById("empty-message");
    const startBtn = document.getElementById("start-btn");
    const startHelper = document.getElementById("start-helper");

    const MIN_PLAYERS = 1;

    function renderPlayers() {
      list.innerHTML = "";

      players.forEach((name, index) => {
        const li = document.createElement("li");
        li.className = "list-item";

        const badge = document.createElement("span");
        badge.className = "list-item-index";
        badge.textContent = index + 1;

        const label = document.createElement("span");
        label.className = "list-item-name";
        label.textContent = name;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "icon-btn";
        removeBtn.setAttribute("aria-label", "Retirer " + name);
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          players.splice(index, 1);
          renderPlayers();
        });

        li.append(badge, label, removeBtn);
        list.appendChild(li);
      });

      emptyMessage.hidden = players.length !== 0;

      const missing = MIN_PLAYERS - players.length;
      startBtn.disabled = missing > 0;
      startHelper.hidden = missing <= 0;
      if (missing > 0) {
        startHelper.textContent = missing === 1
          ? "Ajoutez encore 1 joueur pour commencer"
          : "Ajoutez au moins " + MIN_PLAYERS + " joueurs pour commencer";
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;
      players.push(name);
      nameInput.value = "";
      nameInput.focus();
      renderPlayers();
    });

    startBtn.addEventListener("click", () => {
      if (startBtn.disabled) return;
      sessionStorage.setItem("cochons_players", JSON.stringify(players));
      window.location.href = "partie.html";
    });

    const quitModal = document.getElementById("quit-modal");
    document.getElementById("menu-btn").addEventListener("click", () => {
      quitModal.hidden = false;
    });
    document.getElementById("quit-no").addEventListener("click", () => {
      quitModal.hidden = true;
    });
    document.getElementById("quit-yes").addEventListener("click", () => {
      window.location.href = "../index.html";
    });

    renderPlayers();
  </script>

</body>
</html>
