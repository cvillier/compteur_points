<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<title>Sélection des scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>10.000 🎲🎲🎲🎲🎲</h1>

  <div class="stack">

    <ol class="list">
      <li class="list-item">
        <span class="list-item-name">Score pour entrer</span>
        <div class="stepper">
          <button type="button" class="stepper-btn" id="entry-minus" aria-label="Diminuer">−</button>
          <input type="number" id="entry-input" class="score-input score-input-medium" step="100" value="500">
          <button type="button" class="stepper-btn" id="entry-plus" aria-label="Augmenter">+</button>
        </div>
      </li>
      <li class="list-item">
        <span class="list-item-name">Score à atteindre</span>
        <div class="stepper">
          <button type="button" class="stepper-btn" id="target-minus" aria-label="Diminuer">−</button>
          <input type="number" id="target-input" class="score-input score-input-medium" step="1000" value="10000">
          <button type="button" class="stepper-btn" id="target-plus" aria-label="Augmenter">+</button>
        </div>
      </li>
    </ol>

    <button id="start-btn" class="btn" type="button">Lancer la partie 🥳</button>

  </div>

  <button id="menu-btn" class="btn-outline btn-block" type="button">Menu principal</button>

  <div id="quit-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <p class="modal-question">Êtes-vous sûr de vouloir quitter la partie en cours ?</p>
      <div class="modal-actions">
        <button id="quit-no" class="btn-outline btn-outline-success">NON 😊</button>
        <button id="quit-yes" class="btn btn-danger">OUI 😣</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    const players = JSON.parse(sessionStorage.getItem("dixmille_players") || "[]");

    if (players.length === 0) {
      window.location.href = "selection-des-joueurs.html";
    } else {
      const entryInput = document.getElementById("entry-input");
      const targetInput = document.getElementById("target-input");

      document.getElementById("entry-minus").addEventListener("click", () => {
        entryInput.value = Math.max(0, (Number(entryInput.value) || 0) - 100);
      });
      document.getElementById("entry-plus").addEventListener("click", () => {
        entryInput.value = (Number(entryInput.value) || 0) + 100;
      });
      document.getElementById("target-minus").addEventListener("click", () => {
        targetInput.value = Math.max(0, (Number(targetInput.value) || 0) - 1000);
      });
      document.getElementById("target-plus").addEventListener("click", () => {
        targetInput.value = (Number(targetInput.value) || 0) + 1000;
      });

      document.getElementById("start-btn").addEventListener("click", () => {
        sessionStorage.setItem("dixmille_scores", JSON.stringify({
          entry: Number(entryInput.value) || 0,
          target: Number(targetInput.value) || 0,
        }));
        window.location.href = "partie.html";
      });

      const quitModal = document.getElementById("quit-modal");
      document.getElementById("menu-btn").addEventListener("click", () => {
        quitModal.hidden = false;
      });
      document.getElementById("quit-no").addEventListener("click", () => {
        quitModal.hidden = true;
      });
      document.getElementById("quit-yes").addEventListener("click", () => {
        window.location.href = "../index.html";
      });
    }
  </script>

</body>
</html>
